[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid4g"
version = "2.0.0"
description = "Liquid Zimbabwe 4G Network Optimizer - Hybrid Agentic System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Cassava AI Team", email = "ai-team@liquid.tech"}
]
keywords = ["4g", "network", "optimization", "telecom", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # LLM Integration
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "langchain-anthropic>=0.0.1",
    "openai>=1.10.0",
    "anthropic>=0.8.0",

    # HTTP Client
    "httpx>=0.26.0",
    "requests>=2.31.0",

    # Async
    "asyncio>=3.4.3",
    "aiofiles>=23.2.1",

    # Cache
    "redis>=5.0.0",

    # API
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",

    # UI
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",

    # Monitoring
    "prometheus-client>=0.19.0",

    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",

    # Utilities
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",  # For testing async HTTP

    # Linting
    "ruff>=0.1.0",
    "black>=23.12.0",
    "mypy>=1.7.0",
    "isort>=5.13.0",

    # Type stubs
    "types-pyyaml",
    "types-requests",
    "types-redis",
]

local-llm = [
    "ollama>=0.1.0",
]

[project.scripts]
liquid4g = "liquid4g.__main__:main"

[project.urls]
Homepage = "https://github.com/liquid-technologies/liquid4g-optimizer"
Documentation = "https://docs.liquid4g.tech"
Repository = "https://github.com/liquid-technologies/liquid4g-optimizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=liquid4g --cov-report=html --cov-report=term"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/liquid4g"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.isort]
profile = "black"
line_length = 100
