version: '3.8'

services:
  liquid-4g-ui-test:
    build:
      context: ../
      dockerfile: lz-container/Dockerfile.ui-test
    container_name: lz-ui-test
    ports:
      - "8501:8501"
    networks:
      - liquid-4g-net
    environment:
      - LZ_ENV=testing
      - TZ=UTC
      - CONTAINER_PORT=8501
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  liquid-4g-net:
    driver: bridge