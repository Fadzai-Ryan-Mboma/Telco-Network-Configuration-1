[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cassava-4g-network-optimiser"
version = "1.0.0"
description = "AI-powered 4G LTE network optimization for Huawei eNodeB infrastructure"
readme = "README.md"
license = {text = "Proprietary - Cassava Technologies"}
requires-python = ">=3.11"
authors = [
    {name = "Cassava Technologies", email = "ai@cassavatech.com"}
]
keywords = ["4g", "lte", "network", "optimization", "huawei", "enodeb", "ai", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Telecommunications Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

dependencies = [
    # Core async & HTTP
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    
    # LangChain & LangGraph
    "langchain>=0.3.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langgraph>=0.2.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    
    # Data validation & models
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # UI
    "streamlit>=1.39.0",
    "streamlit-autorefresh>=1.0.1",
    "plotly>=5.24.0",
    
    # Utilities
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
cassava-optimiser = "cassava_optimizer.main:main"
init-db = "cassava_optimizer.scripts.init_db:main"

[project.urls]
Homepage = "https://cassavatech.com"
Documentation = "https://docs.cassavatech.com/network-optimiser"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cassava_optimizer" = ["py.typed", "config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["cassava_optimizer"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*", "langchain.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/cassava_optimizer"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
