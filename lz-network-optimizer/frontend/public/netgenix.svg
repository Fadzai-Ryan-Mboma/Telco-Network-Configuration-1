  <!-- Central node -->
  <circle cx="16" cy="16" r="4" fill="#00D9A5"/>

  <!-- Top node -->
  <circle cx="16" cy="6" r="2.5" fill="#00D9A5"/>
  <line x1="16" y1="8.5" x2="16" y2="12" stroke="#00D9A5" stroke-width="1.5"/>

  <!-- Bottom left node -->
  <circle cx="7" cy="24" r="2.5" fill="#00D9A5"/>
  <line x1="9" y1="22.5" x2="13" y2="18.5" stroke="#00D9A5" stroke-width="1.5"/>

  <!-- Bottom right node -->
