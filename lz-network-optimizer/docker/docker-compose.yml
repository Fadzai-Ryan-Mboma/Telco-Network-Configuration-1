# ============================================================================
# Liquid Zimbabwe 4G Network Optimizer - Docker Compose Configuration
# ============================================================================
# Version: 2.1.0
# Purpose: Full-stack deployment with API + UI + Logging
# Services: FastAPI Backend (8503) + Streamlit UI (8501)
# ============================================================================

services:
  # ==========================================================================
  # LZ Network Optimizer Service (API + UI)
  # ==========================================================================
  lz-optimizer:
    # Build configuration
    build:
      context: ..
      dockerfile: docker/Dockerfile

    # Container name
    container_name: lz-network-optimizer

    # Image name and tag
    image: lz-network-optimizer:latest

    # Restart policy
    restart: unless-stopped

    # ========================================================================
    # Environment Variables
    # ========================================================================
    environment:
      # Timezone
      - TZ=Africa/Harare

      # Python configuration
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      # Application mode (development, staging, production)
      - APP_ENV=production
      
      # Logging configuration
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true

    # Load secrets from .env file (one directory up from docker/)
    env_file:
      - ../.env

    # Command: Run both API and UI
    command: ["both"]

    # ========================================================================
    # Volume Mounts
    # ========================================================================
    volumes:
      # Database persistence (read-write)
      - ../data:/app/data

      # Configuration files (read-only)
      - ../config:/app/config:ro

      # Logs directory (read-write) - mounted to host for easy access
      - ../logs:/app/logs

      # UI assets (read-only)
      - ../ui:/app/ui:ro

      # API code (read-only)
      - ../api:/app/api:ro

    # ========================================================================
    # Networking
    # ========================================================================
    networks:
      - lz-network

    # Ports
    ports:
      - "8502:8502"  # Streamlit UI
      - "8503:8503"  # FastAPI Backend

    # ========================================================================
    # Resource Limits
    # ========================================================================
    deploy:
      resources:
        limits:
          # Maximum resources
          memory: 2G
          cpus: '2.0'
        reservations:
          # Minimum guaranteed resources
          memory: 1G
          cpus: '1.0'

    # ========================================================================
    # Logging Configuration
    # ========================================================================
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Maximum log file size
        max-file: "3"       # Keep 3 rotated log files
        compress: "true"    # Compress rotated logs

    # ========================================================================
    # Health Check
    # ========================================================================
    healthcheck:
      test: ["CMD", "python3", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # ========================================================================
    # Command Override Examples
    # ========================================================================
    # Default: Shows help menu
    # Override with specific commands:

    # Run optimization for a specific site:
    # command: ["python3", "main.py", "optimize", "--site", "MSH0013-Bindura-Zaoga"]

    # Run in interactive mode:
    # command: ["python3", "main.py", "interactive"]

    # Run tests:
    # command: ["python3", "-m", "pytest", "tests/"]

# ============================================================================
# Networks
# ============================================================================
networks:
  lz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# Usage Instructions
# ============================================================================
#
# 1. Build the container:
#    cd lz-network-optimizer
#    docker-compose -f docker/docker-compose.yml build
#
# 2. Start services (API + UI with logging):
#    docker-compose -f docker/docker-compose.yml up
#
# 3. Run in detached mode (background):
#    docker-compose -f docker/docker-compose.yml up -d
#
# 4. View logs (live):
#    docker-compose -f docker/docker-compose.yml logs -f
#
# 5. View logs on host:
#    tail -f logs/app.log
#
# 6. Stop the services:
#    docker-compose -f docker/docker-compose.yml down
#
# 7. Rebuild after code changes:
#    docker-compose -f docker/docker-compose.yml build --no-cache
#    docker-compose -f docker/docker-compose.yml up -d
#
# 8. Interactive shell:
#    docker-compose -f docker/docker-compose.yml exec lz-optimizer bash
#
# 9. Check container health:
#    docker-compose -f docker/docker-compose.yml ps
#
# ============================================================================
# Access Points
# ============================================================================
#
# Streamlit UI:    http://localhost:8501
# FastAPI Backend: http://localhost:8503
# API Docs:        http://localhost:8503/docs
# Health Check:    http://localhost:8503/api/health
#
# ============================================================================
# Environment Variables Required in .env
# ============================================================================
#
# NVIDIA_API_KEY="your-nvidia-api-key"
# HUAWEI_API_URL="https://your-huawei-api-endpoint"
# HUAWEI_USERNAME="your-username"
# HUAWEI_PASSWORD="your-password"
#
# ============================================================================
