version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8503:8503"
    environment:
      - HUAWEI_API_URL=${HUAWEI_API_URL}
      - HUAWEI_USERNAME=${HUAWEI_USERNAME}
      - HUAWEI_PASSWORD=${HUAWEI_PASSWORD}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8503/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8503
    ports:
      - "8502:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: netgenix-network
