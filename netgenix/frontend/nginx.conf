server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker assigns a new IP when a service container is recreated. Resolve
    # service names through Docker's embedded DNS instead of caching the
    # backend IP for the lifetime of this Nginx process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        set $backend_upstream netgenix-backend:8510;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy noVNC (live view for Evaluation reconnect) to the backend's
    # websockify instance, which serves both the static noVNC client and the
    # WebSocket-to-VNC bridge on the same port. This must come before the
    # regex `location ~* \.(js|css|...)$` block below — nginx gives regex
    # locations higher precedence than prefix locations regardless of file
    # order, so without an explicit `^~` here, requests for /vnc/*.css or
    # /vnc/*.js would match the static-asset regex first and 404 against the
    # React app's own dist directory instead of reaching this proxy.
    location ^~ /vnc/ {
        set $backend_vnc_upstream netgenix-backend:6080;
        rewrite ^/vnc/(.*)$ /$1 break;
        proxy_pass http://$backend_vnc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
